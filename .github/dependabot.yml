version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Majors included, so each month's Actions updates arrive as one PR.
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    allow:
      # Include transitive packages (certifi, filelock, virtualenv): the security audit blocks on any fixable CVE in uv.lock.
      - dependency-type: all
    groups:
      all:
        patterns:
          - "*"
      # No security-updates group: while a grouped security PR is open, Dependabot defers fixes for packages not already in it.
    # action.yml pip-installs the package, so uv.lock never reaches users.
    # `deps` is not in release-please's changelog-sections, so these bumps don't cut a release.
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 7
